<!-- Public Citizen Dashboard -->
<div class="citizen-dashboard-root">
  <!-- Public Header -->
  <app-citizen-header></app-citizen-header>

  <main class="main-content">
    <!-- Hero Section -->
    <app-citizen-hero 
      [searchQuery]="searchQuery()"
      [selectedCategory]="selectedCategory()"
      (searchChange)="onSearchChange($event)"
      (categorySelect)="onCategorySelect($event)"
    ></app-citizen-hero>

    <!-- Popular Government Schemes Section (Placed directly below Hero) -->
    <app-citizen-schemes 
      [searchQuery]="searchQuery()"
      [selectedCategory]="selectedCategory()"
      (resetFilters)="onResetFilters()"
    ></app-citizen-schemes>

    <!-- Explore by Category Section -->
    <app-citizen-categories 
      [selectedCategory]="selectedCategory()"
      (categorySelect)="onCategorySelect($event)"
    ></app-citizen-categories>

    <!-- How PolicyGPT Works -->
    <app-citizen-how-it-works></app-citizen-how-it-works>

    <!-- Frequently Asked Questions & Knowledge Desk Section -->
    <app-citizen-faq></app-citizen-faq>

    <!-- AI Assistant CTA Section -->
    <app-citizen-assistant></app-citizen-assistant>

    <!-- Bottom Banner -->
    <app-citizen-banner (exploreClick)="scrollToSchemes()"></app-citizen-banner>
  </main>

  <!-- Floating AI Assistant Button (Bottom Right) -->
  <button 
    type="button" 
    class="floating-ai-assistant-btn" 
    (click)="scrollToAssistant()"
    aria-label="Open AI Assistant"
  >
    <span class="bot-icon">🤖</span>
    <span class="btn-label">AI Assistant</span>
  </button>

  <!-- Public Footer -->
  <app-citizen-footer></app-citizen-footer>
</div>
