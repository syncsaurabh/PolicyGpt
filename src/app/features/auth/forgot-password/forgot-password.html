<div class="login-container">
  <div class="login-heading">
    <h2>Forgot Password?</h2>
    <p>Enter your registered email to receive a password reset link.</p>
  </div>

  <!-- ALERTS -->
  @if (errorMessage) {
    <div class="form-alert alert-error" role="alert">
      <svg class="alert-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <!-- FORM -->
  <form (submit)="onSubmit(); $event.preventDefault()">
    <div class="input-group">
      <label for="email">
        <svg class="label-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Email Address
      </label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your registered email address"
        required
        autocomplete="email"
      />
    </div>

    <button
      type="submit"
      class="login-button"
      [disabled]="isSubmitting"
      style="margin-top: 10px;"
    >
      @if (isSubmitting) {
        <span class="btn-spinner"></span>
        <span>Sending Reset Link...</span>
      } @else {
        <span>Send Reset Link</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      }
    </button>
  </form>

  <div class="form-footer-prompt">
    <a routerLink="/login" class="back-link">
      <svg class="back-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Login
    </a>
  </div>
</div>
