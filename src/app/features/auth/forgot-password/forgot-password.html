<div class="auth-page-wrapper">
  <!-- Brand Header -->
  <header class="brand-header">
    <h1 class="brand-title">PolicyGPT</h1>
    <p class="brand-subtitle">Government Policy &amp; Public Scheme Intelligence Platform</p>
  </header>

  <!-- Reset Password Card -->
  <section class="auth-card">
    <div class="auth-card-body">
      <!-- Card Heading -->
      <div class="card-heading">
        <h2 class="card-title">Forgot Password?</h2>
        <p class="card-subtitle">
          Enter your registered email to receive a password reset link.
        </p>
      </div>

      @if (errorMessage) {
        <div class="form-error-alert" role="alert">
          <span>{{ errorMessage }}</span>
        </div>
      }

      <!-- Password Reset Form -->
      <form (submit)="onSubmit(); $event.preventDefault()" class="auth-form">
        <!-- Email Input Field Block -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            class="form-input" 
            id="email" 
            name="email" 
            type="email" 
            [(ngModel)]="email"
            placeholder="Enter your email address" 
            required 
          />
        </div>

        <!-- Submit Button -->
        <div class="form-action-group">
          <button type="submit" class="btn-primary-auth" [disabled]="isSubmitting">
            @if (isSubmitting) {
              Sending Link...
            } @else {
              Send Reset Link
            }
          </button>
        </div>

        <!-- Back to Login Link -->
        <div class="back-link-wrapper">
          <a routerLink="/login" class="link-back">
            ← Back to Login
          </a>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 PolicyGPT · Government Policy &amp; Public Scheme Intelligence Platform</p>
  </footer>
</div>
