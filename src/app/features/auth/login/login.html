<div class="login-card">
  <div class="login-header">
    <div class="logo-icon">P</div>
    <h2>Sign In to PolicyGPT</h2>
    <p>Authentication Role Simulator</p>
  </div>

  <form (submit)="onSubmit(); $event.preventDefault()" class="login-form">
    <div class="form-group">
      <label for="username">Username / Identifier</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        [(ngModel)]="username" 
        placeholder="e.g. John Doe"
        required
      >
    </div>

    <div class="form-group">
      <label for="role-select">Select Simulation Role</label>
      <select 
        id="role-select" 
        name="roleSelect" 
        [(ngModel)]="selectedRole"
      >
        @for (role of roles; track role) {
          <option [value]="role">{{ role }}</option>
        }
      </select>
      <span class="field-hint">Simulate different user viewpoints instantly.</span>
    </div>

    <button type="submit" class="login-submit-btn">Authorize & Proceed</button>
  </form>
</div>
