$kind: collection
name: PolicyGPT API
description: |-
  REST API collection for the PolicyGPT backend (FastAPI + PostgreSQL).
  Base URL: http://localhost:8000
  All protected endpoints require a Bearer JWT token obtained from POST /api/v1/auth/login.
  Set the {{baseUrl}} and {{authToken}} collection variables before running requests.
variables:
  - key: baseUrl
    value: 'http://localhost:8000'
    description: 'Base URL of the running PolicyGPT backend server'
  - key: authToken
    value: ''
    description: 'JWT Bearer token obtained from POST /api/v1/auth/login'
  - key: apiV1
    value: '/api/v1'
    description: 'API version prefix'
