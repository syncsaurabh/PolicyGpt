$kind: http-request
name: 'Update Notification Preferences'
method: PUT
url: '{{baseUrl}}{{apiV1}}/notifications/preferences'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email_enabled": true,
      "sms_enabled": false,
      "in_app_enabled": true,
      "policy_alerts": true,
      "scheme_updates": true,
      "deadline_reminders": true,
      "system_alerts": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
