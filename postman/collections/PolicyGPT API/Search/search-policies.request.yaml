$kind: http-request
name: 'Search Policies'
method: GET
url: '{{baseUrl}}{{apiV1}}/search/policies?keyword=education&page=1&page_size=10'
order: 1000
queryParams:
  - key: keyword
    value: 'education'
    description: 'Free-text keyword to match title and description'
  - key: category
    value: ''
    description: 'Filter by policy category'
    disabled: true
  - key: state
    value: ''
    description: 'Filter by state or central domain'
    disabled: true
  - key: ministry
    value: ''
    description: 'Filter by ministry name'
    disabled: true
  - key: department
    value: ''
    description: 'Filter by department name'
    disabled: true
  - key: sector
    value: ''
    description: 'Filter by economic or social sector'
    disabled: true
  - key: publication_date
    value: ''
    description: 'Filter by publication date (YYYY-MM-DD)'
    disabled: true
  - key: status
    value: ''
    description: 'Filter by policy status (DRAFT, PUBLISHED, etc.)'
    disabled: true
  - key: page
    value: '1'
  - key: page_size
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has results array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("results");
          pm.expect(json.results).to.be.an("array");
      });
