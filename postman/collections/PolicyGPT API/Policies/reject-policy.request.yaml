$kind: http-request
name: 'Reject Policy'
method: POST
url: '{{baseUrl}}{{apiV1}}/policies/:id/reject'
order: 8000
pathVariables:
  - key: id
    value: '{{policyId}}'
    description: 'Policy ID'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Policy requires additional supporting documentation.",
      "publish": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
