$kind: http-request
name: 'Archive Policy (Soft Delete)'
method: DELETE
url: '{{baseUrl}}{{apiV1}}/policies/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{policyId}}'
    description: 'Policy ID'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
