$kind: http-request
name: 'Submit Policy for Approval'
method: POST
url: '{{baseUrl}}{{apiV1}}/policies/:id/submit'
order: 6000
pathVariables:
  - key: id
    value: '{{policyId}}'
    description: 'Policy ID'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
